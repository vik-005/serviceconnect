name: servi_connect_mobile
description: "ServiConnect - Plateforme mise en relation clients/prestataires"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.3.0
  
  # HTTP & Auth
  dio: ^5.7.0+1
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2
  
  # Maps
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  
  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  record: ^6.0.0
  just_audio: ^0.9.40
  video_player: ^2.9.1
  
  # Firebase Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  
  # Utils
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  
  # Serializers
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cookie_jar: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
